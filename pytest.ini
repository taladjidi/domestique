[pytest]
markers =
    hardware: tests requiring BLE/ANT hardware (opt-in via `pytest -m hardware`)
    release_serial: wall-clock perf assertions that are meaningless under parallel CPU contention; the release gate runs these in a serial tail (`-m release_serial`) after the parallel bulk (`-m "not release_serial"`)

# Skip hardware-gated tests by default. Run them explicitly with:
#   pytest -m hardware
# Or include them alongside the regular suite with:
#   pytest -m "hardware or not hardware"
addopts = -m "not hardware"
# An xfail that starts PASSING is a bug that got fixed and a test that now
# guards nothing -- and without this it is reported as xpassed, which is not a
# failure, so nobody looks. 13 of the 18 xfail marks here were non-strict when
# this was added; the suite had 0 xpassed at the time, so turning it on costs
# nothing today and reports the next one.
xfail_strict = true

